	<div class="TRS_Editor"><div></div><p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　经原国家工商行政管理总局授权，原江苏省工商局于2017年9月8日对国网江苏省电力有限公司南京市溧水区供电分公司涉嫌滥用市场支配地位实施垄断行为立案调查。在调查期间，当事人提交了中止调查申请书并承诺采取整改措施，2018年8月23日，原江苏省工商局对本案作出了中止调查决定。当事人在规定时限内履行了整改承诺，未出现《反垄断法》所规定的恢复调查情形，江苏省市场监督管理局于2018年12月3日对本案作出终止调查决定。现予公告。&#xa0;</p><p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　&#xa0;</p><p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　&#xa0;</p><p class="MsoNormal" style="text-align:right;font-size: 12pt; line-height: 200%">　　&#xa0;&#xa0;&#xa0;2018年12月17日　　&#xa0;</p><p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　附件：<a href="/cms_files/filemanager/samr/www/samrnew/samrgkml/nsjg/bgt/201902/W020190216646463141636.doc">国网江苏省电力有限公司南京市溧水区供电分公司涉嫌垄断案终止调查决定书</a>
