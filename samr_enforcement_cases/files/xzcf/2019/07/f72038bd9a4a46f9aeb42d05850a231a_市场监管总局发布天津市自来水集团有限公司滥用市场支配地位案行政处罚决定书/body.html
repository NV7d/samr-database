  <p align="justify" style="font-size: 12pt; line-height: 200%">　　经授权，原天津市市场和质量监督管理委员会于2017年11月对天津市自来水集团有限公司涉嫌滥用市场支配地位实施垄断行为立案调查。2019年5月，天津市市场监督管理委员会对本案作出行政处罚决定。现予公告。</p> 
  <p align="justify" style="font-size: 12pt; line-height: 200%"> </p>
