  <p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　原上海市物价局于2017年11月2日对海昌隐形眼镜有限公司上海分公司、上海海俪恩隐形眼镜光学有限公司涉嫌垄断行为进行立案调查，于2018年3月16日作出中止调查决定，并对当事人履行整改承诺的情况进行监督。经查，当事人在规定的时限内履行了整改承诺，未出现法律所规定的恢复调查情形。依据《中华人民共和国反垄断法》有关规定，上海市市场监督管理局于2019年4月24日对本案作出终止调查决定，现予公告。</p> 
  <p align="right" class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　2019年5月20日</p>
