	<p class="MsoNormal" style="text-align:center;font-size: 12pt; line-height: 200%">　　<span style="font-family:黑体;font-size: 18pt"><strong>市场监管总局发布对江苏德威收购和时利股权</strong></span></p><p class="MsoNormal" style="text-align:center;font-size: 12pt; line-height: 200%"><span style="font-family:黑体;font-size: 18pt"><strong>　　未依法申报案的行政处罚决定书</strong></span></p><p class="MsoNormal" style="text-align:center;font-size: 12pt; line-height: 200%">&#xa0;</p><p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　2019年2月14日，国家市场监督管理总局对江苏德威收购和时利股权未依法申报案作出行政处罚决定。现将行政处罚决定书予以公告。</p><p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　<a href="/cms_files/filemanager/samr/www/samrnew/samrgkml/nsjg/bgt/201902/W020190221390820107183.doc">附件：行政处罚决定书（国市监处〔2019〕1号）</a></p>
