  <p class="MsoNormal" style="font-size: 12pt; line-height: 200%">　　经原国家工商行政管理总局授权，原江苏省工商行政管理局于2017年5月对江苏宿迁正源自来水有限公司涉嫌滥用市场支配地位实施垄断行为立案调查。2019年10月，江苏省市场监督管理局对本案作出行政处罚决定。现予公告。</p>
