  <p style="font-size: 12pt; line-height: 200%">　　原北京市发展改革委于2018年7月对联想（北京）有限公司涉嫌垄断行为开展调查。机构改革后，此案件由北京市市场监管局继续调查。2019年9月16日，北京市市场监管局决定对本案中止调查，现予公告。</p> 
  <p class="p" style="font-size: 12pt; line-height: 200%">　　附件：北京市市场监督管理局垄断案件中止调查决定书（京市监价中止<span style="font-size: 12pt">﹝2019﹞1号</span><span style="font-size: 12pt">）</span></p>
