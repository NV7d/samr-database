  <p style="font-size: 12pt; line-height: 200%">　　2019年6月，上海市市场监管局依据《反垄断法》对上海食派士商贸发展有限公司涉嫌滥用市场支配地位行为开展调查。2019年8月，上海市市场监管局依法决定对当事人正式立案调查。2020年12月25日，上海市市场监管局依法作出行政处罚决定，对当事人处以其2018年销售额3%的罚款，合计人民币116.86万元。</p> 
  <p align="right" style="font-size: 12pt; line-height: 200%">　　</p>
