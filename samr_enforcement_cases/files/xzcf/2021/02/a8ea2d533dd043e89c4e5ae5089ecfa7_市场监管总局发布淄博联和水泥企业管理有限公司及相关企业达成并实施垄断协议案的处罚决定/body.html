  <p style="font-size: 12pt; line-height: 200%">　　根据企业实名举报，山东省市场监督管理局于2019年4月对淄博联和水泥企业管理有限公司和7家水泥企业涉嫌垄断协议行为立案调查。经调查，2021年1月28日，山东省市场监督管理局对8家涉案当事人依法作出没收违法所得8657.2万元并处2018年度销售额2%的罚款计14172.3万元，罚没款共计22829.5万元，现予公告。</p>
