  <p align="" style="line-height: 200%; font-size: 12pt;">　　根据国务院第五次大督查反馈的问题线索，2018年12月，云南省市场监管局对蒙自四通泰兴供水有限公司涉嫌垄断问题立案调查。2021年1月21日，云南省市场监管局对当事人依法作出行政处罚决定，责令其停止违法行为，并对其处以2018年度销售额6%的罚款，计2495422.79元。现予公告。</p>
