  <span> <p class="MsoNormal" style="text-indent: 21pt"> </p> <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><b><span style="font-size: 20pt; font-family: 宋体; font-weight: bold"><font face="宋体">竞争执法公告</font></span></b></p> <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312">2017年7号</span></p> <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> <font face="仿宋_GB2312">经国家工商行政管理总局授权，宁夏回族自治区工商行政管理局于</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">201</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">4</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)"><font face="仿宋_GB2312">年</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">6</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)"><font face="仿宋_GB2312">月</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">26</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)"><font face="仿宋_GB2312">日对中国电信股份有限公司宁夏分公司</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312"><font face="仿宋_GB2312">涉嫌垄断行为进行立案调查。</font>2015年5月14日，对本案作出中止调查决定。因当事人在规定的时限内履行了整改承诺，未出现法律所规定的恢复调查情形，宁夏回族自治区工商行政管理局依据《中华人民共和国反垄断法》及《工商行政管理机关查处垄断协议、滥用市场支配地位案件程序规定》有关规定，于2016年12月9日对本案作出终止调查决定。现予公告。</span></p> <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> <p align="right" class="MsoNormal" style="word-break: break-all; text-align: right; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312">2017年2月16日</span></p> <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> </span>
