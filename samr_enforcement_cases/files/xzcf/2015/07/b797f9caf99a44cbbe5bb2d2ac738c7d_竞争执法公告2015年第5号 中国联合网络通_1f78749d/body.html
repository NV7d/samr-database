  <p class="p" style="text-align: center; margin: 5pt 0pt; line-height: 180%"><span class="15" style="font-size: 15pt; font-family: 宋体; font-weight: bold; color: rgb(0,0,0)">竞争执法公告</span></p> 
  <p class="p" style="text-align: center; margin: 5pt 0pt; line-height: 180%"><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">201</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">5</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">年第</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">5</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">号</span></p> 
  <p class="MsoNormal" style="text-indent: 30pt"><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">经国家工商行政管理总局授权，</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">宁夏回族自治区</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">工商行政管理局于20</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">13</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">年</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">6</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">月对</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">中国联合网络通信有限公司宁夏回族自治区分公司涉嫌垄断</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">行为进行立案调查，于201</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">5</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">年</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">5</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">月</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">14日对该公司</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">作出中止调查决定，现予公告。</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">同时，请社会各界对当事人履行承诺的情况进行监督</span><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)">。</span></p> 
  <p class="MsoNormal" style="text-indent: 30pt"><span style="font-size: 15pt; font-family: 宋体; color: rgb(0,0,0)"> </span></p>
