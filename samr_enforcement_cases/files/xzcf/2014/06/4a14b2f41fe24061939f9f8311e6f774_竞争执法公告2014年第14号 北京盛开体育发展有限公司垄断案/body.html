 <p class="p0" style="margin-bottom: 0pt; layout-grid-mode: char; text-align: center; margin-top: 0pt; line-height: 25pt"><font size="3">2014年第14号</font><span style="font-size: 18pt; font-weight: bold">
   <p></p></span></p> 
 <p class="p0" style="margin-bottom: 0pt; layout-grid-mode: char; margin-top: 0pt; line-height: 25pt; text-indent: 27.86pt"><font size="3">国家工商行政管理总局依照反垄断工作职责，于2014年3月19日对北京盛开体育发展有限公司涉嫌垄断行为启动反垄断调查。在调查过程中，当事人认识到自身存在问题，积极提出及落实整改措施，消除所造成的不利影响，并提交中止调查申请。经研究，国家工商行政管理总局依据《中华人民共和国反垄断法》及《工商行政管理机关查处垄断协议、滥用市场支配地位案件程序规定》有关规定，于2014年6月3日对本案作出中止调查决定，现予公告。同时，请社会各界对当事人履行承诺的情况进行监督。
   <p></p></font></p>
