 <p align="" style="line-height: 200%; font-size: 12pt;">　　浙江省市场监督管理局于2020年7月对湖州市5家二手车交易市场企业涉嫌达成并实施垄断协议行为立案调查。2020年11月2日，浙江省市场监督管理局对本案5家当事人作出行政处罚决定，现予公告。</p> 
 <p align="" style="line-height: 200%; font-size: 12pt;">　　附件：浙江省市场监督管理局行政处罚决定书（浙市监案〔2020〕9-13号）</p>
