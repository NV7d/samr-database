  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><b><span style="font-size: 20pt; font-family: 宋体; font-weight: bold"><font face="宋体">竞争执法公告</font></span></b></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312">2016年第9号</span></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> <font face="仿宋_GB2312">经国家工商行政管理总局授权，</font><font face="仿宋_GB2312">安徽省工商行政管理局于</font>2015年2月5日对</span><span style="font-size: 16pt; font-family: 仿宋_GB2312"><font face="仿宋_GB2312">信雅达系统工程股份有限公司、北京兆日科技有限责任公司、上海海基业高科技有限公司等三家企业</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312"><font face="仿宋_GB2312">涉嫌垄断协议行为进行立案调查，于</font>2016年9月18日对涉案当事人作出行政处罚决定<font face="仿宋_GB2312">，现予公告。</font></span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p>
