  <p align="right" class="MsoNormal" style="text-align: right; text-indent: 21pt"> </p> 
  <p align="right" class="MsoNormal" style="text-align: right; text-indent: 21pt"><span style="font-size: 16pt; font-family: 宋体; color: rgb(0,0,0)"> </span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><b><span style="font-size: 20pt; font-family: 宋体; font-weight: bold">竞争执法公告</span></b></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312">201</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">6</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">年第</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">4</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">号</span></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> 经国家工商行政管理总局授权，</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">内蒙古自治区</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">工商行政管理局于201</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">5</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">年</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">7</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">月</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">对</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">阿拉善左旗城市给排水公司</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">涉嫌滥用市场支配地位实施附加不合理交易条件的垄断</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">行为进行立案调查，于201</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">6</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">年</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">4</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">月2</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">2</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">日对涉案当事人作出行政处罚决定，现予公告。</span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312">                       </span><span style="font-size: 16pt; font-family: 仿宋_GB2312">2016</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">年</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">5</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">月</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">31</span><span style="font-size: 16pt; font-family: 仿宋_GB2312">日</span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p>
