  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><b><span style="font-size: 20pt; font-family: 宋体; font-weight: bold"><font face="宋体">竞争执法公告</font></span></b></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312">2016年14号</span></p> 
  <p align="center" class="MsoNormal" style="text-align: center; text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> </span></p> 
  <p class="MsoNormal" style="text-indent: 21pt"><span style="font-size: 16pt; font-family: 仿宋_GB2312"> <font face="仿宋_GB2312">经国家工商行政管理总局授权，湖南省工商行政管理局于</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">201</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">5</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)"><font face="仿宋_GB2312">年</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">7</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)"><font face="仿宋_GB2312">月</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)">15</span><span style="font-size: 16pt; font-family: 仿宋_GB2312; color: rgb(0,0,0)"><font face="仿宋_GB2312">日</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312"><font face="仿宋_GB2312">对</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312"><font face="仿宋_GB2312">湖南盐业股份有限公司永州市分公司</font></span><span style="font-size: 16pt; font-family: 仿宋_GB2312"><font face="仿宋_GB2312">涉嫌滥用市场支配地位强制搭售的垄断行为进行立案调查，于</font>2016年10月26日对涉案当事人作出行政处罚决定，现予公告。</span></p>
